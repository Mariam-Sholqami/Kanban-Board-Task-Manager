    <!-- start create/edit task modal -->
    <div class="modal fade" id="taskModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="taskModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content task-modal-content">
                <div class="modal-header border-0 d-flex justify-content-between">
                    <h1 class="modal-title modal-title-kanban" id="taskModalLabel">Create New Task</h1>
                    <button type="button" class="modal-close-btn border-0" data-bs-dismiss="modal" aria-label="Close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="modal-body pt-1">
                    <form id="taskForm">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label field-label"><i class="fa-solid fa-heading"></i>Task
                                Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control task-input" id="taskTitle"
                                placeholder="What needs to be done?">
                            <p class="field-error d-none" id="titleError"></p>
                        </div>
                        <div class="row">
                            <div class="col-12 col-sm-6 mb-3">
                                <label for="taskPriority" class="form-label field-label"><i
                                        class="fa-solid fa-flag"></i>Priority</label>
                                <select class="form-select task-input" id="taskPriority">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            <div class="col-12 col-sm-6 mb-3">
                                <label for="taskDueDate" class="form-label field-label"><i
                                        class="fa-regular fa-calendar"></i>Due Date</label>
                                <input type="date" class="form-control task-input" id="taskDueDate">
                                <p class="field-error d-none" id="dueDateError"></p>
                            </div>
                        </div>
                        <div class="mb-1">
                            <label for="taskDescription" class="form-label field-label"><i
                                    class="fa-solid fa-align-left"></i>Description</label>
                            <textarea class="form-control task-input" id="taskDescription" rows="4" maxlength="500"
                                placeholder="Add more details about this task..."></textarea>
                            <p class="char-count text-end m-0"><span id="descCount">0</span>/500</p>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn-task btn-cancel flex-fill" data-bs-dismiss="modal">Cancel</button>
                    <button id="saveTaskBtn" type="button" class="btn-task btn-add flex-fill"><i
                            class="fa-solid fa-plus"></i>Add Task</button>
                    <button id="updateTaskBtn" type="button" class="btn-task btn-add flex-fill d-none"><i
                            class="fa-solid fa-floppy-disk"></i>Save Changes</button>
                </div>
            </div>
        </div>
    </div>
